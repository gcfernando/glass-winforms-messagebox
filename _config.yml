# GitHub Pages documentation site; does not configure application deployment.
url: "https://gcfernando.github.io"
baseurl: "/glass-winforms-messagebox"
title: "Glass.Message"
description: "A Windows Forms MessageBox replacement with Mica and Acrylic backdrops, async dialogs, inline inputs, progress bars and toast notifications."
lang: "en"
plugins:
  - jekyll-sitemap
exclude:
  - packages
  - bin
  - obj
  - node_modules
  - vendor
  - tests
  - .claude
  - .agents
  - .codex
defaults:
  - scope:
      path: "CHANGELOG.md"
    values:
      title: "Glass.Message Changelog and Release Notes"
      description: "Review Glass.Message release history, including new Windows Forms dialog features, fixes and compatibility changes."
  - scope:
      path: "README.md"
    values:
      title: "Glass.Message — Modern WinForms Dialogs for .NET"
      description: "Add themed Windows Forms dialogs, inputs, progress indicators and toasts with Glass.Message for C#/.NET. Explore installation, previews and migration notes."
  - scope:
      path: "README.nuget.md"
    values:
      title: "Glass.Message — WinForms Dialogs from NuGet"
      description: "Install Glass.Message from NuGet and add themed C# Windows Forms dialogs, async inputs, progress indicators and toast notifications."

# Public documentation navigation and presentation.
repository: gcfernando/glass-winforms-messagebox
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Libraries & packages"
